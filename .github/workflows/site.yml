name: Website checks

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Reject local filesystem links in public exports
        run: |
          if rg -n 'file:///' static-site offline-site; then
            exit 1
          fi
